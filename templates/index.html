<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Watermark Remover</title>
<style>
  :root {
    --bg: #12151a;
    --panel: #1a1e26;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #5eead4;
    --accent-dim: #2c7a6f;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 720px; }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .drop {
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 36px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .drop:hover, .drop.drag { border-color: var(--accent); }
  .drop p { margin: 8px 0 0; color: var(--muted); font-size: 0.85rem; }
  input[type=file] { display: none; }
  #frameStage {
    position: relative;
    display: none;
    margin-top: 4px;
    line-height: 0;
    max-width: 100%;
    overflow: auto;
  }
  #frameImg { max-width: 100%; display: block; border-radius: 8px; cursor: crosshair; user-select: none; touch-action: none; }
  #selBox {
    position: absolute;
    border: 2px solid var(--accent);
    background: rgba(94, 234, 212, 0.15);
    display: none;
    pointer-events: none;
  }
  .hint { color: var(--muted); font-size: 0.8rem; margin-top: 10px; }
  button {
    background: var(--accent);
    color: #0b0f12;
    border: none;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    margin-top: 14px;
  }
  button:disabled { background: var(--accent-dim); color: #0b0f12aa; cursor: not-allowed; }
  #status { font-size: 0.85rem; color: var(--muted); margin-top: 10px; min-height: 1.2em; }
  #status.error { color: var(--danger); }
  #downloadLink {
    display: none;
    margin-top: 14px;
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  video#preview { width: 100%; border-radius: 8px; margin-top: 14px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Watermark Remover</h1>
  <p class="sub">Upload a clip, drag a box over the logo, and process. Works best on a fixed-position watermark over a fairly static background.</p>

  <div class="panel">
    <label class="drop" id="dropZone">
      <input type="file" id="fileInput" accept="video/*" />
      <div id="dropLabel">Click or drop a video file</div>
      <p>MP4, MOV, MKV, WEBM &middot; up to 500MB</p>
    </label>

    <div id="frameStage">
      <img id="frameImg" alt="First frame preview" />
      <div id="selBox"></div>
    </div>
    <p class="hint" id="dragHint" style="display:none;">Drag a rectangle over the watermark on the frame above.</p>

    <button id="processBtn" style="display:none;" disabled>Remove watermark</button>
    <div id="status"></div>
    <video id="preview" controls></video>
    <a id="downloadLink" href="#" download>Download processed video →</a>
  </div>
</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const dropLabel = document.getElementById('dropLabel');
const frameStage = document.getElementById('frameStage');
const frameImg = document.getElementById('frameImg');
const selBox = document.getElementById('selBox');
const dragHint = document.getElementById('dragHint');
const processBtn = document.getElementById('processBtn');
const statusEl = document.getElementById('status');
const preview = document.getElementById('preview');
const downloadLink = document.getElementById('downloadLink');

let jobId = null, ext = null, realW = 0, realH = 0;
let dragging = false, startX = 0, startY = 0, region = null;

['dragenter', 'dragover'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('drag'); }));
dropZone.addEventListener('drop', e => {
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.className = isError ? 'error' : '';
}

async function handleFile(file) {
  dropLabel.textContent = `Uploading ${file.name}...`;
  setStatus('');
  const fd = new FormData();
  fd.append('video', file);
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Upload failed');
    jobId = data.job_id;
    ext = data.ext;
    realW = data.width;
    realH = data.height;
    frameImg.src = data.frame_url + '?t=' + Date.now();
    dropLabel.textContent = `Loaded: ${file.name}`;
    frameStage.style.display = 'block';
    dragHint.style.display = 'block';
    processBtn.style.display = 'inline-block';
  } catch (err) {
    setStatus(err.message, true);
    dropLabel.textContent = 'Click or drop a video file';
  }
}

function pointFromEvent(e) {
  const rect = frameImg.getBoundingClientRect();
  const p = e.touches && e.touches.length ? e.touches[0] : e;
  return { x: p.clientX - rect.left, y: p.clientY - rect.top };
}

function dragStart(e) {
  e.preventDefault();
  const pt = pointFromEvent(e);
  startX = pt.x;
  startY = pt.y;
  dragging = true;
  selBox.style.display = 'block';
  selBox.style.left = startX + 'px';
  selBox.style.top = startY + 'px';
  selBox.style.width = '0px';
  selBox.style.height = '0px';
}

function dragMove(e) {
  if (!dragging) return;
  e.preventDefault();
  const pt = pointFromEvent(e);
  const left = Math.min(startX, pt.x), top = Math.min(startY, pt.y);
  const w = Math.abs(pt.x - startX), h = Math.abs(pt.y - startY);
  selBox.style.left = left + 'px';
  selBox.style.top = top + 'px';
  selBox.style.width = w + 'px';
  selBox.style.height = h + 'px';
}

function dragEnd() {
  if (!dragging) return;
  dragging = false;
  const scaleX = realW / frameImg.clientWidth;
  const scaleY = realH / frameImg.clientHeight;
  const left = parseFloat(selBox.style.left);
  const top = parseFloat(selBox.style.top);
  const w = parseFloat(selBox.style.width);
  const h = parseFloat(selBox.style.height);
  if (w > 3 && h > 3) {
    region = {
      x: Math.round(left * scaleX),
      y: Math.round(top * scaleY),
      w: Math.round(w * scaleX),
      h: Math.round(h * scaleY),
    };
    processBtn.disabled = false;
    setStatus('Region selected. Ready to process.');
  }
}

frameImg.addEventListener('mousedown', dragStart);
frameImg.addEventListener('mousemove', dragMove);
window.addEventListener('mouseup', dragEnd);

frameImg.addEventListener('touchstart', dragStart, { passive: false });
frameImg.addEventListener('touchmove', dragMove, { passive: false });
window.addEventListener('touchend', dragEnd);
window.addEventListener('touchcancel', dragEnd);

processBtn.addEventListener('click', async () => {
  if (!jobId || !region) return;
  processBtn.disabled = true;
  setStatus('Processing... this can take a minute for longer clips.');
  try {
    const res = await fetch('/api/process', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ job_id: jobId, ext, ...region }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Processing failed');
    setStatus('Done.');
    preview.src = data.download_url;
    preview.style.display = 'block';
    downloadLink.href = data.download_url;
    downloadLink.style.display = 'inline-block';
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    processBtn.disabled = false;
  }
});
</script>
</body>
</html>
